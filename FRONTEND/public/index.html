<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="utf-8" />

<meta
 name="viewport"
 content="width=device-width, initial-scale=1"
/>

  <title>Nexus Wholesale Hub | Wholesale Marketplace</title>

<meta
 name="description"
 content="Nexus Wholesale Hub - Global wholesale marketplace connecting buyers with manufacturers, suppliers, and importers."
/>

<meta
 name="keywords"
 content="wholesale marketplace, suppliers, manufacturers, import export, bulk products, Ghana wholesale"
/>

  <meta name="theme-color" content="#175036" />

  <meta property="og:title" content="Nexus Wholesale Hub" />
  <meta
    property="og:description"
    content="Find trusted suppliers and source products globally."
  />
  <meta property="og:type" content="website" />

  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/icon-192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: 'Inter', sans-serif;
      background: #f5f5f5;
      overflow-x: hidden;
    }

    #root {
      min-height: 100vh;
    }

    /* Loading Screen */
    .market-loader {
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .logo {
      color: #175036;
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .logo img {
      height: 48px;
      width: auto;
      display: block;
    }

    .spinner {
      width: 55px;
      height: 55px;
      border: 6px solid #eeeeee;
      border-top: 6px solid #175036;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

</head>

<body>
  <noscript>
    You need to enable JavaScript to run Nexus Wholesale Hub.
  </noscript>

  <!-- Loading Screen -->

  <div id="loader" class="market-loader">
    <div class="logo"><img src="%PUBLIC_URL%/logo.png" alt="Nexus" /></div>
    <div class="spinner"></div>
  </div>

  <!-- React App Mount Point -->

  <div id="root"></div>

  <script>
    window.addEventListener("load", function () {
      const loader = document.getElementById("loader");

      setTimeout(() => {
        if (loader) {
          loader.style.opacity = "0";
          loader.style.transition = "opacity 0.4s ease";

          setTimeout(() => {
            loader.remove();
          }, 400);
        }
      }, 500);
    });
  </script>

</body>
</html>
