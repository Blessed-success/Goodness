<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="utf-8" />

<meta
 name="viewport"
 content="width=device-width, initial-scale=1"
/>

  <meta name="theme-color" content="#ff6a00" />

<meta
 name="description"
 content="BlessedNet Wholesale Hub - Global wholesale marketplace for manufacturers, suppliers, and importers."
/>

<meta
 name="keywords"
 content="wholesale marketplace, suppliers, manufacturers, import export, bulk products, Ghana wholesale"
/>

  <meta property="og:title" content="BlessedNet Wholesale Hub" />
  <meta property="og:type" content="website" />
  <meta
    property="og:description"
    content="Find trusted suppliers and source products globally."
  />

  <title>
    BlessedNet Wholesale Hub | Wholesale Marketplace
  </title>

  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f5f5f5;
    }

    .market-loader {
      position: fixed;
      inset: 0;
      background: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .logo {
      color: #ff6a00;
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .spinner {
      width: 55px;
      height: 55px;
      border: 6px solid #eee;
      border-top: 6px solid #ff6a00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .preview-header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }

    .topbar {
      background: #fafafa;
      font-size: 12px;
      color: #666;
      padding: 6px 20px;
      display: flex;
      justify-content: space-between;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
    }

    .brand {
      color: #ff6a00;
      font-size: 32px;
      font-weight: 800;
    }

    .search-preview {
      width: 55%;
      height: 46px;
      border: 3px solid #ff6a00;
      border-radius: 4px;
      background: white;
    }

    .categories {
      background: #ff6a00;
      color: white;
      display: flex;
      gap: 25px;
      padding: 12px 20px;
      overflow-x: auto;
    }

    .categories span {
      white-space: nowrap;
      font-size: 14px;
      font-weight: 500;
    }

    #root {
      min-height: 100vh;
    }
  </style>

</head>

<body>

  <noscript>
    You need to enable JavaScript to run BlessedNet Wholesale Hub.
  </noscript>

  <div id="loader" class="market-loader">
    <div class="logo">BlessedNet</div>
    <div class="spinner"></div>
  </div>

  <!-- Marketplace Preview Header -->

  <div class="preview-header">

```
<div class="topbar">
  <span>Welcome to BlessedNet Wholesale Hub</span>
  <span>Suppliers | RFQ Center | Orders | Account</span>
</div>

<div class="brand-row">
  <div class="brand">BlessedNet</div>
  <div class="search-preview"></div>
  <div>Cart | Messages</div>
</div>

<div class="categories">
  <span>Electronics</span>
  <span>Home Appliances</span>
  <span>Machinery</span>
  <span>Construction</span>
  <span>Furniture</span>
  <span>Fashion</span>
  <span>Agriculture</span>
  <span>Automotive</span>
  <span>Tools</span>
  <span>Wholesale Deals</span>
</div>
```

  </div>

  <div id="root"></div>

  <script>
    window.addEventListener("load", () => {
      const loader = document.getElementById("loader");

      setTimeout(() => {
        loader.style.opacity = "0";
        loader.style.transition = "0.4s";

        setTimeout(() => {
          loader.remove();
        }, 400);
      }, 500);
    });
  </script>

</body>
</html>
