<meta

  <meta name="theme-color" content="#ff6a00" />

  <meta property="og:title" content="BlessedNet Wholesale Hub" />
  <meta
    property="og:description"
    content="Find trusted suppliers and source products globally."
  />
  <meta property="og:type" content="website" />

  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: 'Inter', sans-serif;
      background: #f5f5f5;
      overflow-x: hidden;
    }

    #root {
      min-height: 100vh;
    }

    /* Loading Screen */
    .market-loader {
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .logo {
      color: #ff6a00;
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .spinner {
      width: 55px;
      height: 55px;
      border: 6px solid #eeeeee;
      border-top: 6px solid #ff6a00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Marketplace Header Preview */
    .preview-header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }

    .topbar {
      background: #fafafa;
      font-size: 12px;
      color: #666666;
      padding: 8px 20px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 20px;
      flex-wrap: wrap;
    }

    .brand {
      color: #ff6a00;
      font-size: 32px;
      font-weight: 800;
    }

    .search-preview {
      flex: 1;
      min-width: 250px;
      max-width: 700px;
      height: 48px;
      border: 3px solid #ff6a00;
      border-radius: 4px;
      background: white;
    }

    .header-links {
      font-size: 14px;
      color: #555;
    }

    .categories {
      background: #ff6a00;
      color: white;
      display: flex;
      gap: 25px;
      padding: 12px 20px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .categories span {
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .categories span:hover {
      opacity: 0.85;
    }
  </style>

</head>

<body>
  <noscript>
    You need to enable JavaScript to run BlessedNet Wholesale Hub.
  </noscript>

  <!-- Loading Screen -->

  <div id="loader" class="market-loader">
    <div class="logo">BlessedNet</div>
    <div class="spinner"></div>
  </div>

  <!-- Marketplace Header Preview -->

  <div class="preview-header">

```
<div class="topbar">

  <span>Suppliers | RFQ Center | Orders | Account</span>
</div>

<div class="brand-row">
  <div class="brand">BlessedNet</div>

  <div class="search-preview"></div>

  <div class="header-links">
    Cart | Messages
  </div>
</div>

<div class="categories">
  <span>Electronics</span>
  <span>Home Appliances</span>
  <span>Machinery</span>
  <span>Construction</span>
  <span>Furniture</span>
  <span>Fashion</span>
  <span>Agriculture</span>
  <span>Automotive</span>
  <span>Tools</span>
  <span>Wholesale Deals</span>
</div>
```

  </div>

  <!-- React App Mount Point -->

  <div id="root"></div>

  <script>
    window.addEventListener("load", function () {
      const loader = document.getElementById("loader");

      setTimeout(() => {
        if (loader) {
          loader.style.opacity = "0";
          loader.style.transition = "opacity 0.4s ease";

          setTimeout(() => {
            loader.remove();
          }, 400);
        }
      }, 500);
    });
  </script>

</body>
</html>
